<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Höre die Vogelstimmen von der Exkursion">
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%232e7d32' width='192' height='192'/%3E%3Ctext x='96' y='100' text-anchor='middle' dy='.3em' font-size='120' fill='white'%3E🐦%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <title>Vogelstimmen Exkursion</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐦 Vogelstimmen</h1>
      <p class="subtitle">in und um die Illenau</p>
      <p class="date">27. Mai 2027</p>
      <p class="hint">Tippe auf einen Vogel, um seine Stimme zu hören</p>
    </header>

    <div id="bird-grid" class="bird-grid"></div>

    <footer>
      <p>Vogelstimmen von <a href="https://xeno-canto.org" target="_blank" rel="noopener">xeno-canto.org</a> | Bilder von <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('Service Worker Registrierung fehlgeschlagen:', err);
      });
    }
  </script>
</body>
</html>
