<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Höre die Vogelstimmen von der Exkursion">
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <!-- iOS / Safari: ohne diese Tags öffnet sich immer der Browser -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vögel">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <title>Vogelstimmen Exkursion</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐦 Vogelstimmen</h1>
      <p class="subtitle">in und um die Illenau</p>
      <p class="date">27. Mai 2027</p>
      <p class="hint">Tippe auf einen Vogel, um seine Stimme zu hören</p>
      <button id="quiz-toggle" onclick="toggleQuizMode()">🎓 Quiz starten</button>
    </header>

    <div id="install-banner" style="display:none; background:#1b5e20; color:white; text-align:center; padding:12px; border-radius:12px; margin-bottom:20px;">
      <span>📲 Diese Seite als App speichern</span>
      <button id="install-btn" style="margin-left:12px; background:white; color:#1b5e20; border:none; padding:8px 16px; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer;">App installieren</button>
    </div>

    <div id="bird-grid" class="bird-grid"></div>

    <footer>
      <p>Vogelstimmen von <a href="https://xeno-canto.org" target="_blank" rel="noopener">xeno-canto.org</a> | Bilder von <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('Service Worker Registrierung fehlgeschlagen:', err);
      });
    }

    // PWA Install-Banner anzeigen wenn Chrome bereit ist
    let installPrompt = null;
    const banner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
      banner.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      const result = await installPrompt.userChoice;
      if (result.outcome === 'accepted') {
        banner.style.display = 'none';
      }
    });

    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
      installPrompt = null;
    });
  </script>
</body>
</html>
